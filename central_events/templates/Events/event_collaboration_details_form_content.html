{% load static %}
{% block collaboration_form %}

    <div class="container" id="PseudonameForContainer">
        <div class="box" id="boxID">
            <h1 class="form-title">Event Collaboration Details</h1>
            {% comment %} <!--Error Message-->
            <div class="py-3 text-center">
                {% for message in messages %}
                    <p style="color:red" class="message">{{message}}</p>
                {% endfor %}
            </div> {% endcomment %}
            <form method="POST">
                {% csrf_token %}
                <div class="box-body">
                    <div class="form-group">
                        <label class="label-heading">Inter Branch Collaboration With: (Press CTRL to select multiple options) </label>
                        <select multiple class="form-control" name="inter_branch_collaboration">
                        <option selected value="null">--------------------</option>
                        {% for inter_branch_collaboration_option in inter_branch_collaboration_options %}
                            <option value={{inter_branch_collaboration_option.primary}}>
                            {{inter_branch_collaboration_option.group_name}}</option>
                        {% endfor %}
                        </select>
                    </div>
                    <br>
                    <div class="form-group">
                        <label class="label-heading">Intra Branch Collaboration With: (Add comma to add multiple options)</label>
                        <input
                            placeholder="Name of the Branches/Organizations"
                            class="label-input"
                            type="text"
                            name="intra_branch_collaboration"                                        
                            />
                    </div>
                    <br>
                    <div style="text-align: center;">
                        <input type="submit" class="btn btn-outline b-success text-success" name="next" value="Continue to Venue & Permissions Tab">
                    </div>
                </div>
            </form>
        </div>
    </div>

{% endblock collaboration_form %}
